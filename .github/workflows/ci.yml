name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install locked upload dependencies
        run: python3 -m pip install --require-hashes --only-binary=:all: -r Resources/runtime-requirements.txt
      - name: Test and build
        run: Scripts/check.sh --build
