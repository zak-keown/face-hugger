name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and pinned Python
        run: |
          brew install xcodegen uv
          uv python install 3.12.14
          dirname "$(uv python find 3.12.14)" >> "$GITHUB_PATH"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Install locked upload dependencies
        run: |
          uv pip install --python "$(uv python find 3.12.14)" --system --require-hashes --only-binary=:all: -r Resources/runtime-requirements.txt
      - name: Test and build
        run: Scripts/check.sh --build
