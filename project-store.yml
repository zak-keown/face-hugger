include:
  - project.yml
name: FaceHuggerStore
targets:
  FaceHugger:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) STORE_BUILD'
        CODE_SIGN_ENTITLEMENTS: Resources/Store.entitlements
        ENABLE_APP_SANDBOX: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '3'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed signed upload runtime
        script: 'python3 "$SRCROOT/Scripts/embed-store-runtime.py"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - '$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/UploadRuntime.bundle'
